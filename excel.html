<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>배송흐름 일괄 조회</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
    --accent: #0f172a; --accent-fg: #ffffff;
    --done: #059669; --done-bg: #ecfdf5;
    --transit: #b45309; --transit-bg: #fffbeb;
    --error: #e11d48; --error-bg: #fff1f2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220; --card: #111827; --border: #1f2937; --text: #f1f5f9; --muted: #94a3b8;
      --accent: #f8fafc; --accent-fg: #0f172a;
      --done: #34d399; --done-bg: #052e21;
      --transit: #fbbf24; --transit-bg: #2a1e04;
      --error: #fb7185; --error-bg: #2a0a12;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --card: #111827; --border: #1f2937; --text: #f1f5f9; --muted: #94a3b8;
    --accent: #f8fafc; --accent-fg: #0f172a;
    --done: #34d399; --done-bg: #052e21;
    --transit: #fbbf24; --transit-bg: #2a1e04;
    --error: #fb7185; --error-bg: #2a0a12;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 18px 60px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px; }
  .card summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  input[type="text"] { width: 100%; font-size: 14px; padding: 9px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  select { width: 100%; font-size: 14px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .hintline { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 28px 16px;
    text-align: center; }
  .drop.drag { border-color: var(--accent); }
  .filename { font-size: 14px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  button { border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 10px 16px; }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--error); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  .filter-group { display: inline-flex; gap: 4px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 3px; }
  .filter-btn { background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 6px; }
  .filter-btn.active { background: var(--card); color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
  .progress-text { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px;
    padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: middle;
    white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .badge.done { background: var(--done-bg); color: var(--done); }
  .badge.transit { background: var(--transit-bg); color: var(--transit); }
  .badge.error { background: var(--error-bg); color: var(--error); }
  .summary-bar { display: flex; gap: 16px; font-size: 12px; color: var(--muted);
    padding-bottom: 10px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
  .table-scroll { overflow-x: auto; }
  #fileInput { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>배송 흐름 일괄 조회</h1>
  <p class="sub">택배사와 운송장번호가 담긴 엑셀을 올리면, 각 건의 가장 최근 배송 흐름을 순서대로 조회합니다.
    한 건만 빠르게 볼 땐 <a href="/index.html" style="color:inherit;">빠른 조회</a>를 이용하세요.</p>

  <details class="card" id="settingsCard">
    <summary>조회 서버 설정 (보통 건드릴 필요 없어요)</summary>
    <label for="proxyUrl">프록시 서버 URL</label>
    <input id="proxyUrl" type="text" value="/track" />
    <div class="hintline">이 페이지와 같은 서버에서 조회하므로 기본값(/track) 그대로 두시면 됩니다.</div>
  </details>

  <div class="card drop" id="dropZone">
    <div id="dropInner">
      <div class="muted" style="margin-bottom:10px;">엑셀 파일을 드래그하거나 아래 버튼으로 선택하세요</div>
      <div class="filename" id="fileName" style="display:none;"></div>
    </div>
    <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" />
    <button class="btn-primary" id="pickFile" style="margin-top:12px;">파일 선택</button>
    <div class="hintline" id="parseError" style="color:var(--error); display:none;"></div>
  </div>

  <div class="card" id="mappingCard" style="display:none;">
    <div class="muted" style="margin-bottom:10px;">컬럼 매칭 확인 (자동 인식 결과예요. 다르면 바꿔주세요)</div>
    <div class="row2">
      <div>
        <label>택배사 컬럼</label>
        <select id="carrierCol"></select>
      </div>
      <div>
        <label>운송장번호 컬럼</label>
        <select id="trackingCol"></select>
      </div>
    </div>
    <div class="row2">
      <div>
        <label>수취인 이름 컬럼 (선택)</label>
        <select id="nameCol"></select>
      </div>
      <div>
        <label>연락처 컬럼 (선택)</label>
        <select id="phoneCol"></select>
      </div>
    </div>
    <div class="hintline" id="rowCountText"></div>
  </div>

  <div class="actions" id="runActions" style="display:none;">
    <button class="btn-primary" id="runBtn">조회 시작</button>
    <button class="btn-danger" id="stopBtn" style="display:none;">중단</button>
    <div class="filter-group" id="filterGroup" style="display:none;">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="transit">배송중</button>
      <button class="filter-btn" data-filter="done">배송완료</button>
      <button class="filter-btn" data-filter="error">오류</button>
    </div>
    <button class="btn-ghost" id="downloadBtn" style="display:none;">결과 엑셀 다운로드</button>
    <span class="progress-text" id="progressText"></span>
  </div>

  <div class="card" id="resultsCard" style="display:none;">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>택배사</th><th>운송장번호</th><th>주문건수</th><th>수취인</th><th>연락처</th><th>상태</th><th>마지막 흐름</th><th>위치</th><th>시각</th></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const CARRIER_CODE_MAP = {
  "우체국택배": "04", "우체국": "04", "EPOST": "04",
  "CJ대한통운": "05", "CJ": "05", "CJ택배": "05", "대한통운": "05",
  "한진택배": "06", "한진": "06",
  "로젠택배": "08", "로젠": "08",
  "롯데택배": "11", "롯데": "11", "롯데글로벌로지스": "11",
  "일양로지스": "12", "일양": "12",
  "EMS": "13", "DHL": "14", "UPS": "16",
  "천일택배": "18", "고려택배": "20", "한덱스": "21",
  "FEDEX": "22", "Fedex": "22",
  "대신택배": "23",
  "GS": "24", "GS편의점택배": "24", "CVSnet": "24", "편의점택배": "24", "GSPostbox": "24",
};

function normalizeCarrierName(raw) {
  return String(raw || "").trim().toUpperCase().replace(/\s/g, "");
}
function resolveCarrierCode(raw) {
  const key = String(raw || "").trim();
  if (CARRIER_CODE_MAP[key]) return CARRIER_CODE_MAP[key];
  const norm = normalizeCarrierName(raw);
  for (const [name, code] of Object.entries(CARRIER_CODE_MAP)) {
    if (normalizeCarrierName(name) === norm) return code;
  }
  for (const [name, code] of Object.entries(CARRIER_CODE_MAP)) {
    if (norm.length >= 2 && (norm.includes(normalizeCarrierName(name)) || normalizeCarrierName(name).includes(norm))) return code;
  }
  return null;
}
function guessColumn(headers, keywords) {
  const lower = headers.map((h) => String(h).toLowerCase());
  for (const kw of keywords) {
    const idx = lower.findIndex((h) => h.includes(kw));
    if (idx !== -1) return headers[idx];
  }
  return "";
}

let rawRows = [];
let headers = [];
let cancelFlag = false;
let results = [];
let currentFilter = "all";

const filterGroup = document.getElementById("filterGroup");
filterGroup.querySelectorAll(".filter-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    filterGroup.querySelectorAll(".filter-btn").forEach((b) => b.classList.toggle("active", b === btn));
    renderResults();
  });
});

function matchesFilter(r) {
  if (currentFilter === "all") return true;
  if (currentFilter === "error") return r.status === "error";
  if (currentFilter === "done") return r.status === "done" && r.complete === true;
  if (currentFilter === "transit") return r.status === "done" && r.complete !== true;
  return true;
}

function sortedResults(list) {
  const withTime = [];
  const withoutTime = [];
  for (const r of list) {
    const t = r.lastTime ? new Date(r.lastTime) : null;
    if (t && !isNaN(t.getTime())) withTime.push({ r, t });
    else withoutTime.push(r);
  }
  withTime.sort((a, b) => a.t - b.t);
  return [...withTime.map((x) => x.r), ...withoutTime];
}

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const pickFile = document.getElementById("pickFile");
const fileNameEl = document.getElementById("fileName");
const parseError = document.getElementById("parseError");
const mappingCard = document.getElementById("mappingCard");
const carrierColSel = document.getElementById("carrierCol");
const trackingColSel = document.getElementById("trackingCol");
const nameColSel = document.getElementById("nameCol");
const phoneColSel = document.getElementById("phoneCol");
const rowCountText = document.getElementById("rowCountText");
const runActions = document.getElementById("runActions");
const runBtn = document.getElementById("runBtn");
const stopBtn = document.getElementById("stopBtn");
const downloadBtn = document.getElementById("downloadBtn");
const progressText = document.getElementById("progressText");
const resultsCard = document.getElementById("resultsCard");
const resultsBody = document.getElementById("resultsBody");
const summaryBar = document.getElementById("summaryBar");
const proxyUrlInput = document.getElementById("proxyUrl");

pickFile.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drag"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("drag");
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

async function handleFile(file) {
  parseError.style.display = "none";
  results = [];
  resultsCard.style.display = "none";
  fileNameEl.style.display = "block";
  fileNameEl.textContent = file.name + " (확인 중…)";

  try {
    const rawBuf = await file.arrayBuffer();

    // 브라우저 라이브러리는 암호 걸린 엑셀을 못 풀기 때문에, 서버에서 미리 풀어서 받아옴
    // (암호가 없는 파일이면 서버가 그대로 통과시켜서 돌려줌)
    const form = new FormData();
    form.append("file", new Blob([rawBuf]), file.name);
    const decRes = await fetch("/decrypt-xlsx", { method: "POST", body: form });
    if (!decRes.ok) {
      const errJson = await decRes.json().catch(() => ({}));
      throw new Error(errJson.detail || errJson.error || `서버 오류 (HTTP ${decRes.status})`);
    }
    const decBuf = await decRes.arrayBuffer();

    const wb = XLSX.read(decBuf, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    if (!json.length) {
      showParseError("엑셀에서 데이터를 찾지 못했어요. 첫 행이 헤더인지 확인해 주세요.");
      fileNameEl.textContent = file.name;
      return;
    }
    headers = Object.keys(json[0]);
    rawRows = json;
    populateColumnSelectors();
    mappingCard.style.display = "block";
    runActions.style.display = "flex";
    updateRowCount();
    fileNameEl.textContent = file.name;
  } catch (err) {
    showParseError("엑셀 파일을 읽는 중 오류가 발생했어요: " + err.message);
    fileNameEl.textContent = file.name;
  }
}

function showParseError(msg) {
  parseError.textContent = msg;
  parseError.style.display = "block";
}

function populateColumnSelectors() {
  [carrierColSel, trackingColSel, nameColSel, phoneColSel].forEach(
    (sel) => (sel.innerHTML = '<option value="">선택 안 함</option>')
  );
  headers.forEach((h) => {
    [carrierColSel, trackingColSel, nameColSel, phoneColSel].forEach((sel) => {
      const o = document.createElement("option");
      o.value = h; o.textContent = h;
      sel.appendChild(o);
    });
  });
  carrierColSel.value = guessColumn(headers, ["택배", "carrier", "carr"]);
  trackingColSel.value = guessColumn(headers, ["운송장", "송장", "tracking", "invoice"]);
  nameColSel.value = guessColumn(headers, ["수취인", "받는사람", "받는분", "고객명", "성명", "이름", "name"]);
  phoneColSel.value = guessColumn(headers, ["연락처", "전화", "휴대폰", "핸드폰", "hp", "phone", "tel"]);
  [carrierColSel, trackingColSel, nameColSel, phoneColSel].forEach((sel) =>
    sel.addEventListener("change", updateRowCount)
  );
}

function rowsToQuery() {
  const cCol = carrierColSel.value, tCol = trackingColSel.value;
  const nCol = nameColSel.value, pCol = phoneColSel.value;
  if (!cCol || !tCol) return [];
  const filtered = rawRows
    .map((r) => ({
      carrierRaw: r[cCol],
      trackingRaw: r[tCol],
      nameRaw: nCol ? r[nCol] : "",
      phoneRaw: pCol ? r[pCol] : "",
    }))
    .filter((r) => String(r.trackingRaw || "").trim());

  // 같은 운송장번호는 하나의 건으로 묶기 (여러 상품이 한 박스로 나간 경우)
  const map = new Map();
  for (const r of filtered) {
    const key = String(r.trackingRaw).trim();
    if (!map.has(key)) {
      map.set(key, {
        carrierRaw: r.carrierRaw,
        trackingRaw: key,
        nameRaw: r.nameRaw,
        phoneRaw: r.phoneRaw,
        orderCount: 0,
      });
    }
    map.get(key).orderCount++;
  }
  return Array.from(map.values());
}

function updateRowCount() {
  const q = rowsToQuery();
  const merged = q.filter((r) => r.orderCount > 1).length;
  let text = `총 ${rawRows.length}행 중 고유 운송장번호 ${q.length}건을 조회합니다.`;
  if (merged > 0) text += ` (${merged}건은 같은 운송장으로 묶임)`;
  rowCountText.textContent = text;
}

async function queryOne(carrierRaw, trackingNumber) {
  const code = resolveCarrierCode(carrierRaw);
  if (!code) return { status: "error", message: `택배사 코드 매칭 실패 (${carrierRaw})` };

  const base = proxyUrlInput.value.trim().replace(/\/+$/, "");
  const params = new URLSearchParams({ t_code: code, t_invoice: String(trackingNumber).trim() });
  const url = `${base}?${params.toString()}`;

  let res;
  try {
    res = await fetch(url);
  } catch (err) {
    return { status: "error", message: `${err.message} — 호출한 주소: ${url}` };
  }
  if (!res.ok) {
    let detail = "";
    try {
      const errBody = await res.json();
      detail = errBody.detail ? ` — ${JSON.stringify(errBody.detail)}` : (errBody.error ? ` — ${errBody.error}` : "");
    } catch {}
    return { status: "error", message: `HTTP ${res.status}${detail} — 호출한 주소: ${url}` };
  }

  const data = await res.json();
  const details = data.trackingDetails || (data.data && data.data.trackingDetails) || [];
  const last = details[details.length - 1];

  return {
    status: "done",
    complete: data.complete ?? (data.data && data.data.complete) ?? null,
    lastKind: (last && (last.kind || last.description)) || "",
    lastWhere: (last && (last.where || last.location)) || "",
    lastTime: (last && (last.time || last.timeString)) || "",
    recipientName: data.recipientName || "",
    recipientPhone: data.recipientPhone || "",
  };
}

function renderResults() {
  const done = results.filter((r) => r.status === "done").length;
  const errored = results.filter((r) => r.status === "error").length;
  summaryBar.innerHTML =
    `<span style="color:var(--done)">성공 ${done}</span>` +
    (errored > 0 ? `<span style="color:var(--error)">실패 ${errored}</span>` : "");

  const visible = sortedResults(results.filter(matchesFilter));

  resultsBody.innerHTML = visible.map((r) => {
    const badgeClass = r.status === "done" ? (r.complete ? "done" : "transit") : "error";
    const badgeText = r.status === "done" ? (r.complete ? "배송완료" : "배송중") : "실패";
    return `<tr>
      <td>${escapeHtml(r.carrierRaw)}</td>
      <td class="mono">${escapeHtml(r.trackingRaw)}</td>
      <td class="muted">${r.orderCount > 1 ? r.orderCount + "건 묶음" : "-"}</td>
      <td>${escapeHtml(r.recipientName || "-")}</td>
      <td class="mono">${escapeHtml(r.recipientPhone || "-")}</td>
      <td><span class="badge ${badgeClass}">${badgeText}</span></td>
      <td>${escapeHtml(r.lastKind || r.message || "-")}</td>
      <td class="muted">${escapeHtml(r.lastWhere || "-")}</td>
      <td class="muted mono">${escapeHtml(r.lastTime || "-")}</td>
    </tr>`;
  }).join("");
  resultsCard.style.display = "block";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

runBtn.addEventListener("click", async () => {
  const queue = rowsToQuery();
  if (!queue.length) return;
  cancelFlag = false;
  results = [];
  runBtn.style.display = "none";
  stopBtn.style.display = "inline-block";
  downloadBtn.style.display = "none";
  filterGroup.style.display = "inline-flex";

  for (let i = 0; i < queue.length; i++) {
    if (cancelFlag) break;
    const { carrierRaw, trackingRaw, nameRaw, phoneRaw, orderCount } = queue[i];
    const r = await queryOne(carrierRaw, trackingRaw);
    // 엑셀에 수취인 컬럼을 지정했으면 그 값을 우선 사용, 없으면 조회 API가 준 값 사용
    if (nameRaw) r.recipientName = nameRaw;
    if (phoneRaw) r.recipientPhone = phoneRaw;
    results.push({ carrierRaw, trackingRaw, orderCount, ...r });
    progressText.textContent = `${i + 1} / ${queue.length} 조회 중…`;
    renderResults();
    await new Promise((res) => setTimeout(res, 250));
  }

  progressText.textContent = "";
  runBtn.style.display = "inline-block";
  stopBtn.style.display = "none";
  if (results.length) downloadBtn.style.display = "inline-block";
});

stopBtn.addEventListener("click", () => { cancelFlag = true; });

downloadBtn.addEventListener("click", () => {
  const sheetData = results.map((r) => ({
    택배사: r.carrierRaw,
    운송장번호: r.trackingRaw,
    묶인주문건수: r.orderCount || 1,
    수취인: r.recipientName || "",
    연락처: r.recipientPhone || "",
    완료여부: r.status === "done" ? (r.complete ? "배송완료" : "배송중") : "조회실패",
    최종상태: r.lastKind || r.message || "",
    최종위치: r.lastWhere || "",
    최종시각: r.lastTime || "",
  }));
  const ws = XLSX.utils.json_to_sheet(sheetData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "배송흐름조회결과");
  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `배송흐름조회결과_${dateStr}.xlsx`);
});
</script>
</body>
</html>
